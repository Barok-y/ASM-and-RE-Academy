[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "academy"
version = "0.1.0"
description = "Assembly & Reverse Engineering Academy - interactive CLI learning platform"
requires-python = ">=3.10"
dependencies = [
    "capstone>=5.0",
    "keystone-engine>=0.9.2",
    "unicorn>=2.1.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "textual>=0.60",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["academy*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
